spring:
  application:
    name: NanoURL
  web:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
  
  datasource:
    url: jdbc:mysql://localhost:3306/nanourl_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: nanourl_user
    password: NanoURL@SecurePass123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximumPoolSize: 20
      minimumIdle: 5
      connectionTimeout: 20000
      idleTimeout: 300000
      maxLifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:9d8f0c6b2e5a4c1f7d9b6a8c3e4f1a0d9c7b5a3e1f6d8c2b4a9e7c5d3b1f0a2c}
  expiration: 86400000

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: 8080

---
# H2 Console Profile (for development only)
spring:
  config:
    activate:
      on-profile: h2
  
  datasource:
    url: jdbc:h2:file:./data/nanourl_db;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Use the PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Ensure the URL is read from the environment variable (Render uses DATABASE_URL)
# Spring Boot often maps DATABASE_URL automatically, but being explicit helps.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

