spring:
  application:
    name: NanoURL
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nanourl_db}
    username: ${SPRING_DATASOURCE_USERNAME:nanourl_user}
    password: ${SPRING_DATASOURCE_PASSWORD:NanoURL@SecurePass123}
    hikari:
      maximumPoolSize: 20
      minimumIdle: 5
      connectionTimeout: 20000
      idleTimeout: 300000
      maxLifetime: 1200000
      auto-commit: true
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  base-url: ${APP_BASE_URL}

server:
  port: 8080

# CORS configuration for production
cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://your-frontend-url.onrender.com}
