spring:
  application:
    name: NanoURL
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nanourl_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:nanourl_user}
    password: ${DB_PASSWORD:NanoURL@SecurePass123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  base-url: ${APP_BASE_URL}

server:
  port: 8080

# CORS configuration for production
cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://your-frontend-url.onrender.com}
