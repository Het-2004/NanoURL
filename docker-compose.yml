services:
  mysql:
    image: mysql:8.0
    container_name: nanourl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nanourl_db
      MYSQL_USER: nanourl_user
      MYSQL_PASSWORD: secure_password
    ports:
      - "33061:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/database_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - nanourl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nanourl-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nanourl_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: nanourl_user
      SPRING_DATASOURCE_PASSWORD: secure_password
      JWT_SECRET: 9d8f0c6b2e5a4c1f7d9b6a8c3e4f1a0d9c7b5a3e1f6d8c2b4a9e7c5d3b1f0a2c
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nanourl-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nanourl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nanourl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  nanourl-network:
    driver: bridge
