# Production Configuration for Render
spring.application.name=NanoURL

# Database - PostgreSQL (Render)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nanourl_db}
spring.datasource.username=${DATABASE_USERNAME:nanourl_user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:NanoURLProductionSecretKey2026ForJWTTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Base URL for short links
app.base-url=${APP_BASE_URL:https://nanourl-api.onrender.com}

# Disable H2 Console in production
spring.h2.console.enabled=false
