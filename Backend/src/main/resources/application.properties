# Application Name
spring.application.name=NanoURL

# Server Configuration
server.port=8080
app.base-url=http://localhost:8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nanourl_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=nanourl_user
spring.datasource.password=NanoURL@SecurePass123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=NanoURLSecureSecretKeyFor256BitHS256Algorithm2024!
jwt.expiration=86400000

# Logging
logging.level.com.NanoURL=INFO
logging.level.org.springframework.security=WARN

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
